name: Publish verified customer Android build 19
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-customer-build19
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch signed public APK and verify its exact hash and size
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --max-time 180 --output PrintERP-Customer-0.6.10-build19.apk https://printerp-client-downloads.netlify.app/PrintERP-Customer-0.6.10-build19.apk
          printf '%s  %s\n' 04e643f620e6c0fbe1dd6aa601bed21c672f760ce0f72fd6048edc2859f9b859 PrintERP-Customer-0.6.10-build19.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test "$(stat --format=%s PrintERP-Customer-0.6.10-build19.apk)" = 42440761
      - name: Publish only the verified APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload customer-v0.6.10-build19 PrintERP-Customer-0.6.10-build19.apk SHA256SUMS.txt --clobber
          gh release edit customer-v0.6.10-build19 --draft=false --latest
